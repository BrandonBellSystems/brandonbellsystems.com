name: Validate

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - '.github/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check file exists
        run: test -f dist/index.html

      - name: Check file size
        run: |
          SIZE=$(stat -c%s "dist/index.html")
          echo "Portfolio size: ${SIZE} bytes (~$((SIZE / 1024))KB)"
          if [ "$SIZE" -gt 500000 ]; then
            echo "::warning::Large file — review for bloat"
          fi

      - name: Verify CSP header present
        run: grep -q "Content-Security-Policy" dist/index.html && echo "CSP found" || exit 1
